name: schedu
services:
  app:
    image: schedu:local
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.19.0-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    init: true
    ports:
      - "${SCHEDU_BIND_ADDRESS:-127.0.0.1}:${SCHEDU_HTTP_PORT:-8080}:3000/tcp"
    environment:
      SCHEDU_ORIGIN: ${SCHEDU_ORIGIN:-http://localhost:8080}
      SCHEDU_SETUP_TOKEN: ${SCHEDU_SETUP_TOKEN:?Set a random SCHEDU_SETUP_TOKEN in .env}
      TZ: Asia/Shanghai
    volumes:
      - schedu_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  schedu_data:
